# Production and test stack (design/13-deployment.md §2): Caddy, two app instances, PostgreSQL, Redis, MinIO.
name: ${COMPOSE_PROJECT_NAME:-auction}

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/dester2/site_auction}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-auction};Username=${POSTGRES_USER:-auction};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ConnectionStrings__Redis: redis:6379
    Storage__Provider: Minio
    Storage__Minio__Endpoint: minio:9000
    Storage__Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
    Storage__Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      APP_UPSTREAMS: ${APP_UPSTREAMS:-app-1:8080 app-2:8080}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app-1

  app-1: *app

  app-2: *app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auction}
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do sleep 1; done
      && mc mb --ignore-existing local/media
      && mc anonymous set download local/media"

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
