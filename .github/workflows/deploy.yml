# Delivery (design/13-deployment.md §3): CI, image to GHCR tagged by commit SHA, rolling deploy over SSH.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || 'test' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'production' || 'test' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_DIR/deploy'"
          scp docker-compose.yml "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"
          scp deploy/Caddyfile deploy/deploy.sh deploy/backup.sh "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/deploy/"

      - name: Log in to GHCR on the server
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Rolling deploy
        run: ssh "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_DIR' && IMAGE_TAG='$GITHUB_SHA' bash deploy/deploy.sh"
