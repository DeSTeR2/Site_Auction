# Local development overrides: one app built from source, plain HTTP on :8000, PostgreSQL and MinIO console exposed.
services:
  caddy:
    environment:
      SITE_ADDRESS: ":80"
      APP_UPSTREAMS: "app-1:8080"
    ports: !override
      - "8000:80"

  app-1:
    build: .
    image: auction-app:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Email__Provider: File

  app-2:
    profiles: ["scale"]

  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9001:9001"
